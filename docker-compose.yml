services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-restaurantes}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-restaurantes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-restaurantes}
      DB_HOST: db
      DB_PORT: 5432
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      AI_MODULE_API_KEY: ${AI_MODULE_API_KEY}
      AI_ASR_URL: ${AI_ASR_URL:-http://ai-bridge:8000/asr}
      AI_TTS_URL: ${AI_TTS_URL:-http://ai-bridge:8000/tts}
      AI_AUDIO_DIR: ${AI_AUDIO_DIR:-/app/uploads/ai-audio}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    depends_on:
      - backend
    ports:
      - "3001:80"

  client-web:
    build:
      context: ./client-web
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    depends_on:
      - backend
    environment:
      # Runtime WebSocket URL used by nginx envsubst to inject into HTML
      WS_URL: ${WS_URL:-ws://host.docker.internal:3000}
    ports:
      - "3002:80"

  ads-module:
    build:
      context: ./ads-module
    environment:
      ADS_PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      - backend

  ai-bridge:
    build:
      context: ./ai-bridge
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_ASR_FUNCTION_ID: ${NVIDIA_ASR_FUNCTION_ID:-b702f636-f60c-4a3d-a6f4-f3568c13bd7d}
      NVIDIA_TTS_FUNCTION_ID: ${NVIDIA_TTS_FUNCTION_ID}
      NVIDIA_GRPC_TARGET: ${NVIDIA_GRPC_TARGET:-grpc.nvcf.nvidia.com:443}
      NVIDIA_GRPC_USE_SSL: ${NVIDIA_GRPC_USE_SSL:-true}
    ports:
      - "8000:8000"

volumes:
  db_data:
